<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriConnect</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4caf50, #81c784);
      min-height: 100vh;
    }
    .login-container {
      background: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 5rem auto;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2e7d32;
    }
    .btn-login {
      background-color: #2e7d32;
      color: white;
      width: 100%;
    }
    .btn-login:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">AgriConnect</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="buy.html">Buy</a></li>
          <li class="nav-item"><a class="nav-link" href="sell.html">Sell</a></li>
        <li class="nav-item"><a class="nav-link" href="weather.html">Weather Alert</a></li>
        <li class="nav-item"><a class="nav-link" href="coldstorage.html">Cold Storage </a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us </a></li>
        <li class="nav-item"><a class="nav-link" href="guidance.html">Guidance </a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register </a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login </a></li>
        <li class="nav-item"><a class="nav-link " href="about.html">About</a></li>
        </ul>
    </div>
  </div>
</nav>

<!-- Login Section -->
<div class="login-container">
  <h2>Login to AgriConnect</h2>
  <form id="loginForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
    </div>

    <!-- Captcha -->
    <div class="mb-3">
      <label for="captchaInput" class="form-label">Captcha: <span id="captchaQuestion"></span></label>
      <input type="text" class="form-control" id="captchaInput" placeholder="Enter captcha answer" required>
    </div>

    <div class="d-grid mt-3">
      <button type="submit" class="btn btn-login">Login</button>
    </div>
    <p class="text-center mt-3">Don't have an account? <a href="register.html">Register here</a></p>
  </form>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2025 AgriConnect. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let captchaAnswer;

  function generateCaptcha() {
    const num1 = Math.floor(Math.random()*10) + 1;
    const num2 = Math.floor(Math.random()*10) + 1;
    captchaAnswer = num1 + num2;
    document.getElementById('captchaQuestion').textContent = `${num1} + ${num2} = ?`;
  }

  // Generate captcha on page load
  generateCaptcha();

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const userCaptcha = parseInt(document.getElementById('captchaInput').value);

    if(userCaptcha !== captchaAnswer){
      alert('Captcha incorrect! Please try again.');
      generateCaptcha(); // refresh captcha
      document.getElementById('captchaInput').value = '';
      return;
    }

    alert('Login successful! (This is a placeholder. Connect to backend for real login)');
    this.reset();
    generateCaptcha(); // refresh captcha for next login
  });
</script>
</body>
</html>
