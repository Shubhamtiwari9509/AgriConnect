<section class="container my-5">
  <h1 class="text-center mb-4">Find Nearest Cold Storage</h1>
  <p class="text-center mb-5">Click the button to find the nearest cold storage from your current location.</p>
  <div class="text-center">
    <button class="btn btn-success" onclick="findNearestStorage()">Find Nearest Cold Storage</button>
  </div>
  <div class="mt-4 text-center" id="result"></div>
</section>

<script>
// Example cold storage locations (latitude, longitude, name)
const coldStorages = [
  {name: "Cold Storage A", lat: 28.6139, lon: 77.2090},
  {name: "Cold Storage B", lat: 27.1767, lon: 78.0081},
  {name: "Cold Storage C", lat: 26.9124, lon: 75.7873}
];

// Haversine formula to calculate distance between two lat/lon points in km
function getDistance(lat1, lon1, lat2, lon2){
  const R = 6371; // Radius of Earth in km
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLon/2)*Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Find nearest cold storage
function findNearestStorage(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(position => {
      const userLat = position.coords.latitude;
      const userLon = position.coords.longitude;
      
      let nearest = null;
      let minDistance = Infinity;
      
      coldStorages.forEach(storage => {
        const dist = getDistance(userLat, userLon, storage.lat, storage.lon);
        if(dist < minDistance){
          minDistance = dist;
          nearest = storage;
        }
      });
      
      document.getElementById('result').innerHTML = `
        <h3>Nearest Cold Storage: ${nearest.name}</h3>
        <p>Distance: ${minDistance.toFixed(2)} km</p>
        <a href="https://www.google.com/maps/search/?api=1&query=${nearest.lat},${nearest.lon}" target="_blank" class="btn btn-primary">View on Map</a>
      `;
    }, error => {
      alert('Please allow location access to find nearest cold storage.');
    });
  } else {
    alert('Geolocation is not supported by your browser.');
  }
}
</script>
