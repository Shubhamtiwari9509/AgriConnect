<!-- Sell Section -->
<section class="container my-5">
  <h1 class="text-center mb-4">Sell Your Products</h1>

  <!-- Product Form -->
  <div class="row justify-content-center">
    <div class="col-md-8">
      <form id="sellForm">
        <div class="mb-3">
          <label for="productName" class="form-label">Product Name</label>
          <input type="text" class="form-control" id="productName" placeholder="Enter product name" required>
        </div>
        <div class="mb-3">
          <label for="productPrice" class="form-label">Price (₹)</label>
          <input type="number" class="form-control" id="productPrice" placeholder="Enter price" required>
        </div>
        <div class="mb-3">
          <label for="productQuality" class="form-label">Quality</label>
          <input type="text" class="form-control" id="productQuality" placeholder="Enter quality" required>
        </div>
        <div class="mb-3">
          <label for="productImage" class="form-label">Image URL</label>
          <input type="url" class="form-control" id="productImage" placeholder="Enter image URL" required>
        </div>
        <div class="mb-3">
          <label for="productAddress" class="form-label">Address</label>
          <textarea class="form-control" id="productAddress" rows="3" placeholder="Enter your address" required></textarea>
        </div>
        <div class="d-grid mt-3">
          <button type="submit" class="btn btn-success">Submit Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Display Submitted Products -->
  <div class="row mt-5" id="submittedProducts">
    <!-- Dynamically added products will appear here -->
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2025 AgriConnect. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('sellForm').addEventListener('submit', function(e){
  e.preventDefault();

  const name = document.getElementById('productName').value;
  const price = document.getElementById('productPrice').value;
  const quality = document.getElementById('productQuality').value;
  const img = document.getElementById('productImage').value;
  const address = document.getElementById('productAddress').value;

  const container = document.getElementById('submittedProducts');

  const card = document.createElement('div');
  card.classList.add('col-md-4', 'mb-4');
  card.innerHTML = `
    <div class="card shadow">
      <img src="${img}" class="card-img-top" alt="${name}">
      <div class="card-body">
        <h5 class="card-title">${name}</h5>
        <p class="card-text"><strong>Price:</strong> ₹${price}</p>
        <p class="card-text"><strong>Quality:</strong> ${quality}</p>
        <p class="card-text"><strong>Address:</strong> ${address}</p>
        <button class="btn btn-success w-100">Interested Buyer</button>
      </div>
    </div>
  `;

  container.appendChild(card);
  this.reset();
  alert('Product submitted successfully!');
});
</script>
</body>
